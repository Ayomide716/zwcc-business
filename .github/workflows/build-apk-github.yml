name: Build APK on GitHub

# Builds the release APK entirely on a GitHub runner — no EAS, no build quota.
# Public repositories get unlimited Actions minutes on standard runners, so this
# is the one that keeps working when the Expo free plan's monthly builds run out.
#
# Run it from the GitHub website or mobile app:
#   Actions -> Build APK on GitHub -> Run workflow
#
# Requires four repository secrets, all from the EAS keystore backup:
#   ANDROID_KEYSTORE_BASE64     the .jks file, base64 encoded, on one line
#   ANDROID_KEYSTORE_PASSWORD   "Android upload keystore password"
#   ANDROID_KEY_ALIAS           "Android key alias"
#   ANDROID_KEY_PASSWORD        "Android key password"
#
# It must be the same keystore EAS used, or the APK will not install over one
# already on a phone — Android refuses to replace an app with a build signed by
# a different key.
#
# The Supabase keys are read from eas.json so there is one source for them
# whichever workflow builds. They are public by design: the anon key is meant to
# ship in the bundle, and every table is protected by row-level security.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'What changed in this build (shown on the release)'
        required: false
        default: ''

# The job attaches the APK to a release, which is a write to the repository.
permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Fail early if the signing secrets are missing
        # Without this the build dies inside Gradle twenty minutes in, with an
        # error that does not say which secret is absent.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Load the public Supabase keys
        # From eas.json rather than repeated here, so the two workflows cannot
        # drift into building against different projects.
        run: |
          node -e "
            const env = require('./eas.json').build.preview.env;
            const lines = Object.entries(env).map(([k, v]) => k + '=' + v);
            require('node:fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n') + '\n');
            console.log('Loaded: ' + Object.keys(env).join(', '));
          "

      - name: Generate the native Android project
        # `android/` is not committed. Regenerating it every build is what keeps
        # app.json and the config plugins as the single description of the app.
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Point the release build at the real signing key
        run: node scripts/configure-android-signing.mjs

      - name: Put the signing key in place
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/zwcc-release.jks

          # Catch a mistyped or truncated secret here rather than in Gradle.
          if ! keytool -list -keystore android/app/zwcc-release.jks \
               -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened. Check ANDROID_KEYSTORE_BASE64 is the whole file on one line, and that ANDROID_KEYSTORE_PASSWORD matches it."
            exit 1
          fi

          # Gradle properties rather than -P flags: command lines are echoed
          # into the log, and this file is on a runner that is thrown away.
          #
          # The leading newline matters. The generated file does not end with
          # one, so appending without it joins the first property onto the last
          # existing line and the property silently does not exist.
          {
            printf '\n'
            echo "ZWCC_KEYSTORE_FILE=zwcc-release.jks"
            echo "ZWCC_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ZWCC_KEY_ALIAS=$KEY_ALIAS"
            echo "ZWCC_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties

          # Reuse compiled output between runs. Without this Gradle recompiles
          # everything every time — around an hour on a two-core runner, most
          # of it native code that has not changed. The build cache lives under
          # ~/.gradle, which the cache step above already persists, so turning
          # it on is what makes a second build fast rather than merely a second
          # build that downloads less.
          #
          # The heap is the template's 2GB, which is tight for a project this
          # size on a runner with 7GB going spare.
          {
            echo "org.gradle.caching=true"
            echo "org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1024m"
          } >> android/gradle.properties

          # Confirm all four are readable as properties, rather than finding out
          # from Gradle two minutes later.
          for property in ZWCC_KEYSTORE_FILE ZWCC_KEYSTORE_PASSWORD ZWCC_KEY_ALIAS ZWCC_KEY_PASSWORD; do
            if ! grep -q "^${property}=" android/gradle.properties; then
              echo "::error::${property} was not written to android/gradle.properties."
              exit 1
            fi
          done
          echo "Signing properties written."

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./app.json').expo.version")
          name="zwcc-grant-${version}-build${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Confirm it is signed with the right key
        # A debug-signed APK builds and installs perfectly on a clean phone and
        # fails only on one that already has the app — after the build has
        # reported success. So the certificate is checked here.
        #
        # It fails the build only on proof of a wrong key: the debug
        # certificate's distinguished name, or two fingerprints that both read
        # cleanly and differ. Anything it cannot parse is a warning, because
        # throwing away an hour of compilation over a changed output format
        # would be the worse mistake.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          # A targeted path, not a search of the whole SDK: find walking
          # thousands of directories is slow and returns non-zero on any
          # unreadable one, which would fail this step for no good reason.
          apksigner=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner was not found, so the signature was not verified."
            exit 0
          fi
          echo "Using $apksigner"

          certs=$("$apksigner" verify --print-certs "$APK" 2>&1 || true)
          echo "$certs"

          if printf '%s' "$certs" | grep -qi 'CN=Android Debug'; then
            echo "::error::The APK is signed with the Android debug key. It would fail to install over an existing copy of the app."
            exit 1
          fi

          normalise() { tr -d ': ' | tr 'A-Z' 'a-z'; }

          expected=$(keytool -list -v -keystore android/app/zwcc-release.jks \
                       -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
                     | grep -m1 'SHA256:' | cut -d' ' -f3- | normalise || true)
          actual=$(printf '%s' "$certs" | grep -m1 -i 'SHA-256 digest' | cut -d':' -f2- | normalise || true)

          echo "keystore certificate: ${expected:-<unreadable>}"
          echo "APK certificate:      ${actual:-<unreadable>}"

          if [ -z "$expected" ] || [ -z "$actual" ]; then
            echo "::warning::Could not read both certificates, so they were not compared. The debug-key check above still passed."
            exit 0
          fi

          if [ "$expected" != "$actual" ]; then
            echo "::error::The APK is not signed with the project keystore. It would fail to install over an existing copy of the app."
            exit 1
          fi
          echo "Signed with the project keystore."

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          notes="${{ inputs.notes }}"
          [ -z "$notes" ] && notes="Built from ${GITHUB_SHA::7}."

          gh release create "$tag" "${{ steps.apk.outputs.name }}" \
            --title "ZWCC Business Grant ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "$notes

          Open this page on an Android phone and tap the .apk to install."

          url=$(gh release view "$tag" --json url --jq .url)
          {
            echo "### Android build"
            echo ""
            echo "**Open this on the phone to install:**"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep a copy on the run
        # A second way to the file if a release is ever deleted by accident.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30
