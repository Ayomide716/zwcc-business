name: Build Android APK

# Run it from the GitHub website or mobile app:
#   Actions -> Build Android APK -> Run workflow
#
# Requires one repository secret:
#   EXPO_TOKEN   expo.dev -> account Settings -> Access tokens -> Create
#                Add at: Settings -> Secrets and variables -> Actions
#
# The Supabase keys come from eas.json, so nothing else is needed here.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production]

jobs:
  build:
    name: Build ${{ inputs.profile }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Must be >= 22: eas-cli 23.x depends on @oclif/plugin-autocomplete,
          # which declares engines.node >= 22 and hard-fails installation on 20.
          node-version: 22
          cache: npm

      - name: Fail early if EXPO_TOKEN is missing
        # Without this the eas step fails with a confusing auth error several
        # minutes in. Better to say exactly what is wrong immediately.
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN is not set. Create a token at expo.dev (Settings -> Access tokens), then add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # The action defaults to yarn for installing the CLI; this project is
          # npm-based, and yarn without a lockfile adds noise for no benefit.
          packager: npm

      - name: Confirm the Expo token works
        # Fails here in seconds with a clear message, rather than deep inside
        # the build with an opaque error.
        run: |
          echo "Authenticated to Expo as: $(npx eas whoami)"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Link or create the EAS project
        # app.json intentionally ships without an EAS projectId, so this writes
        # one for the duration of the run. --force overwrites any stale id.
        run: |
          npx eas init --force --non-interactive || {
            echo "::error::eas init failed. Open expo.dev and check the account tied to EXPO_TOKEN can create projects."
            exit 1
          }

      - name: Build the APK
        # --wait blocks until the cloud build finishes so the run either
        # succeeds with a link or fails visibly, rather than exiting early.
        run: |
          npx eas build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait

      - name: Where to download it
        if: always()
        run: |
          echo "### Build finished" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from your Expo dashboard:" >> $GITHUB_STEP_SUMMARY
          echo "https://expo.dev/accounts/_/projects/zwcc-business-grant/builds" >> $GITHUB_STEP_SUMMARY
